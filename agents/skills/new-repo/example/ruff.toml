exclude = []
indent-width = 2

[format]
indent-style = "tab"
line-ending = "lf"
quote-style = "single"

docstring-code-format = true
skip-magic-trailing-comma = false

[lint]
ignore = ["E741"]

extend-select = [
    "E9",
    "F",
    "ASYNC",
    "RUF006", # dangling asyncio task
    "D213", # docstring summary on next line
    "I", # sort imports
]
